services:

  backend:
    build: .
    container_name: ai-assistant-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
      - redis

  frontend:
    build: .
    container_name: ai-assistant-frontend
    command: python -m streamlit run app/ui.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: ai-assistant-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: ai-assistant-redis
    ports:
      - "6379:6379"

volumes:
  qdrant_data: